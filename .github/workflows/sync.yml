name: Sinkronisasi SIM-PETANI SUMUT
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: sim-petani-sync
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sync-database:
    name: Sinkronisasi Database Kabupaten
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run SIM-PETANI synchronization
        env:
          DB_KARO: ${{ secrets.DB_KARO }}
          DB_DELI_SERDANG: ${{ secrets.DB_DELI_SERDANG }}
          DB_LANGKAT: ${{ secrets.DB_LANGKAT }}
          DB_PUSAT: ${{ secrets.DB_PUSAT }}
        run: python sync_to_central.py
